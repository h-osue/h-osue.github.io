<div>
  <div>
    Todas las fotos &copy;
    {{ with site.Params.author }}
      {{ if and .name .email }}
        <a href="mailto:{{ .email }}">{{ .name }}</a>
      {{ else }}
        {{ .name }}
      {{ end }}
    {{ end }}
    {{ now.Year }}.
  </div>
  <div>
    Creado con
    <a class="mt" href="https://github.com/bep/galleriesdeluxe">Galleries Deluxe</a>.
  </div>
</div>
{{ with site.Params.author.whatsapp }}
  <a
    class="whatsapp-contact"
    href="{{ . }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contactar por WhatsApp"
    title="Contactar por WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 11.7a8.3 8.3 0 0 1-12.2 7.4L4 20.3l1.2-4.1a8.3 8.3 0 1 1 15.3-4.5Z" />
      <path d="M8.6 8.1c.2-.4.4-.4.7-.4h.5c.2 0 .3.1.4.4l.8 1.8c.1.3 0 .5-.1.7l-.6.7c-.2.2-.1.4 0 .6.5.9 1.2 1.7 2.1 2.2.7.4 1.2.6 1.5.7.2.1.4 0 .6-.2l.8-1c.2-.2.4-.3.7-.2l1.8.8c.3.1.4.3.4.5 0 .3-.1 1.3-.8 1.9-.7.6-1.6.8-2.5.6-1-.2-2.3-.7-3.9-1.7-2.3-1.5-3.8-3.8-4.2-4.5-.4-.8-1.1-2.5-.2-3.9Z" />
    </svg>
  </a>
{{ end }}
